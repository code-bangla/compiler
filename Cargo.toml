[workspace]
resolver = "3"

members = [
    "lang-core",
    "lang-interpret",
    "lang-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Moheshwar Amarnath Biswas", "Ababil Hossain", "Somudre Sarkar"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
unicode-normalization = "0.1"
unicode-ident = "1"
